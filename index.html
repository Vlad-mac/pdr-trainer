<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDR Trainer</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e3a8a);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            text-align:center;
            background:rgba(255,255,255,0.08);
            padding:50px;
            border-radius:20px;
            backdrop-filter:blur(10px);
            box-shadow:0 0 25px rgba(0,0,0,.4);
            max-width:700px;
            width:90%;
        }

        h1{
            font-size:48px;
            margin-bottom:20px;
        }

        p{
            font-size:20px;
            margin-bottom:40px;
        }

        button{
            background:#22c55e;
            color:white;
            border:none;
            padding:18px 40px;
            font-size:22px;
            border-radius:12px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#16a34a;
            transform:scale(1.05);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🚗 PDR Trainer</h1>

    <p>
        Онлайн-тренажер для підготовки до теоретичного
        іспиту з Правил дорожнього руху України.
    </p>

    <button onclick="startTest()">
        Почати тест
    </button>
</div>

<script>

function startTest(){
    alert("Незабаром тут відкриється тест ПДР!");
}

</script>

</body>
</html>
