<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDR Trainer — Особистий кабінет</title>
    <meta name="description" content="Особистий кабінет користувача PDR Trainer: профіль, підписка, зміна пароля.">
    <link rel="stylesheet" href="style.css">
</head>
<body style="visibility:hidden;">

    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <h1>Реєстрація</h1>

            <div class="auth-form">
                <input type="text" id="auth-name" placeholder="ПІБ">
                <input type="email" id="auth-email" placeholder="Email">
                <input type="password" id="auth-password" placeholder="Пароль">

                <button class="btn btn-primary" onclick="registerFromForm()">Зареєструватися</button>
                <button class="btn btn-secondary" onclick="loginFromForm()">Увійти</button>
            </div>

            <p id="auth-message" class="auth-message"></p>
        </div>
    </div>

    <div id="app-content" style="display:none;">
        <header class="topbar">
            <div class="logo">🚗 PDR Trainer</div>
            <nav class="menu">
                <a href="index.html">Головна</a>
                <a href="topics.html">Теми</a>
                <a href="training.html">Тренування</a>
                <a href="stats.html">Статистика</a>
                <a href="pronas.html">Про нас</a>
                <a href="profile.html">Особистий кабінет</a>
                <span id="user-greeting" class="user-greeting"></span>
                <a href="#" onclick="logoutUser(); return false;">Вийти</a>
            </nav>
        </header>

        <main class="page">
            <section class="hero">
                <h1>Особистий кабінет</h1>
                <p>Тут можна переглянути дані профілю, статус підписки та змінити пароль.</p>
            </section>

            <section class="card-section">
                <div class="panel" id="profile-info">
                    <p>Завантаження профілю...</p>
                </div>
            </section>

            <section class="card-section">
                <div class="panel">
                    <h2>Зміна пароля</h2>
                    <div class="auth-form">
                        <input type="password" id="new-password" placeholder="Новий пароль">
                        <input type="password" id="confirm-password" placeholder="Повторіть пароль">
                        <button class="btn btn-primary" onclick="changePasswordFromForm()">Зберегти новий пароль</button>
                    </div>
                    <p id="profile-message" class="auth-message"></p>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
